<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 160" width="560" height="160" role="img" aria-label="Ninja Rebirth — Hồi Sinh Nhẫn Giả">
  <defs>
    <linearGradient id="wordmark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8ef"/>
      <stop offset="0.55" stop-color="#ffe2c4"/>
      <stop offset="1" stop-color="#ffb27a"/>
    </linearGradient>
    <linearGradient id="slash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a3c"/>
      <stop offset="1" stop-color="#ff9f43"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a3c" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff9f43" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ff5a3c" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- vệt mực đỏ phía sau -->
  <g filter="url(#soft)" opacity=".3">
    <path d="M66 90 C 190 78, 372 78, 494 88" stroke="url(#slash)" stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>

  <text x="280" y="76" text-anchor="middle"
        font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif"
        font-size="56" font-weight="800" letter-spacing="2"
        fill="url(#wordmark)" stroke="#2a0d08" stroke-width="1.2" paint-order="stroke">NINJA REBIRTH</text>

  <rect x="110" y="99" width="368" height="1.2" fill="url(#rule)"/>

  <text x="280" y="128" text-anchor="middle"
        font-family="'Segoe UI', system-ui, -apple-system, Arial, sans-serif"
        font-size="17" font-weight="600" letter-spacing="13"
        fill="#ffb59d" opacity=".92">HỒI SINH NHẪN GIẢ</text>

  <path d="M64 130 h 22 M494 130 h 22" stroke="#ff5a3c" stroke-width="2" opacity=".45" stroke-linecap="round"/>
</svg>
